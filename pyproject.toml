[project]
name = "agent-chat-acme"
version = "0.1.0"
description = "Interactive chat CLI for AgentCore runtime agent"
readme = "README.md"
authors = [
    { name = "Anuj Agrawal", email = "anujkumar.agrawal@alight.com" }
]
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.26.0",
    "botocore>=1.29.0",
]

[project.scripts]
agent-chat-acme = "agent_chat_acme:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
